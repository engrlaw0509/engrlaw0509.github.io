<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Source for public/og.png — the image that appears when the site is shared
  on Facebook, LinkedIn, Messenger or Viber.

  Rendered at exactly 1200x630 (the size every platform crops to) by:
      npm run og
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500&family=JetBrains+Mono:wght@500&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative;
    background: #FFFFFF;
    color: #0C1E33;
    font-family: "Plus Jakarta Sans", Arial, sans-serif;
    padding: 4.5rem 5rem;
    display: grid;
    align-content: space-between;
    overflow: hidden;
  }
  /* soft accent wash, matching the site hero */
  body::before {
    content: "";
    position: absolute;
    inset: -14rem 0 auto;
    height: 34rem;
    background: radial-gradient(60% 60% at 50% 50%, rgba(0,180,216,.17), transparent 70%);
  }

  .top { position: relative; display: flex; align-items: center; gap: .7rem; }
  .mark { width: 2.5rem; height: 2.5rem; border-radius: .7rem; background: #145C94; display: grid; place-items: center; }
  .brand {
    font-family: "Sora", sans-serif;
    font-weight: 700;
    font-size: 1.4rem;
    letter-spacing: -.02em;
  }

  .mid { position: relative; }
  h1 {
    font-family: "Sora", sans-serif;
    font-weight: 800;
    font-size: 4.4rem;
    line-height: 1.02;
    letter-spacing: -.045em;
    max-width: 20ch;
  }
  h1 em { font-style: normal; color: #145C94; }

  .bottom {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 2rem;
    border-top: 1px solid #DBE6EF;
    padding-top: 1.35rem;
  }
  .tags { display: flex; gap: .5rem; }
  .tags span {
    font-family: "JetBrains Mono", monospace;
    font-size: .8125rem;
    color: #41576F;
    background: #EAF2F8;
    border-radius: .4rem;
    padding: .38rem .6rem;
  }
  .place {
    font-family: "JetBrains Mono", monospace;
    font-size: .8125rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #5A7288;
  }
</style>
</head>
<body>
  <div class="top">
    <span class="mark">
      <svg viewBox="0 0 32 32" width="26" height="26" fill="none" aria-hidden="true">
        <path d="M9 8.5v15h5.6M20.4 23.5v-15l3.6 5.4" stroke="#fff" stroke-width="2.8"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    <span class="brand">LMI Automata Labs</span>
  </div>

  <div class="mid">
    <h1>Software your business can actually run&nbsp;<em>on</em>.</h1>
  </div>

  <div class="bottom">
    <div class="tags">
      <span>Point of sale</span>
      <span>Payroll</span>
      <span>Client portals</span>
      <span>Integrations</span>
    </div>
    <span class="place">Metro Manila &middot; PH</span>
  </div>
</body>
</html>
