<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Source for public/og.png — the image that appears when the site is shared
  on Facebook, LinkedIn, Messenger or Viber.

  Rendered at exactly 1200x630 (the size every platform crops to) by:
      npm run og

  Its colours copy the dark theme's tokens in src/styles/global.css. It is a
  standalone file rendered by a headless browser, so it cannot import them —
  change both together.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Geist+Mono:wght@400;500&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative;
    background: #05080F;
    color: #EEF3FA;
    font-family: "Geist", Arial, sans-serif;
    padding: 3.6rem 4.4rem 3.4rem;
    display: grid;
    align-content: space-between;
    overflow: hidden;
  }
  /* The site's grid, masked to a soft ellipse. */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, rgba(148,170,205,.09) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(148,170,205,.09) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(ellipse 70% 80% at 60% 30%, #000 25%, transparent 75%);
  }
  /* And its two glows. */
  body::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(40% 55% at 22% 10%, rgba(34,211,238,.20), transparent 70%),
      radial-gradient(38% 55% at 82% 18%, rgba(99,102,241,.24), transparent 70%);
  }
  .top, .mid, .bottom { position: relative; z-index: 1; }

  .top { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 1rem; }
  .mark { height: 3.2rem; width: auto; }
  .name { font-weight: 650; font-size: 1.7rem; letter-spacing: -.03em; }
  .live {
    display: inline-flex;
    align-items: center;
    gap: .6rem;
    font-family: "Geist Mono", monospace;
    font-size: .95rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #34D399;
    padding: .55rem 1rem .55rem .85rem;
    border-radius: 999px;
    background: rgba(52,211,153,.10);
    border: 1px solid rgba(52,211,153,.32);
  }
  .live i { width: .6rem; height: .6rem; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 5px rgba(52,211,153,.18); }

  h1 {
    display: grid;
    font-weight: 700;
    font-size: 7.4rem;
    line-height: .95;
    letter-spacing: -.055em;
  }
  .fade {
    background: linear-gradient(180deg, #EEF3FA 35%, #9DA8B9 100%);
    -webkit-background-clip: text;
    color: transparent;
  }
  .grad {
    background: linear-gradient(115deg, #22D3EE 0%, #38BDF8 42%, #818CF8 100%);
    -webkit-background-clip: text;
    color: transparent;
    padding-bottom: .08em;
  }
  .sub { margin-top: 1.1rem; font-size: 1.55rem; color: #A8B5C8; letter-spacing: -.01em; }

  .bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 2rem;
    padding-top: 1.3rem;
    border-top: 1px solid rgba(148,170,205,.18);
  }
  .tags { display: flex; gap: .55rem; }
  .tags span {
    font-family: "Geist Mono", monospace;
    font-size: .95rem;
    color: #A8B5C8;
    background: #0B1220;
    border: 1px solid rgba(148,170,205,.2);
    border-radius: .5rem;
    padding: .45rem .75rem;
  }
  .url { font-family: "Geist Mono", monospace; font-size: 1.05rem; color: #7DD3FC; }
</style>
</head>
<body>
  <div class="top">
    <div class="brand">
      <img class="mark" src="../public/brand/mark-wide-light.png" alt="">
      <span class="name">LMI Automata Labs</span>
    </div>
    <span class="live"><i></i>3 products live</span>
  </div>

  <div class="mid">
    <h1><span class="fade">Automate your</span><span class="grad">business.</span></h1>
    <p class="sub">Software and automation for Philippine businesses.</p>
  </div>

  <div class="bottom">
    <div class="tags">
      <span>Point of sale</span>
      <span>Payroll</span>
      <span>Client portals</span>
      <span>Integrations</span>
      <span>AI automation</span>
    </div>
    <span class="url">lmiautomatalabs.com</span>
  </div>
</body>
</html>
